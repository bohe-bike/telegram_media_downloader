<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Telegram Media Downloader</title>
    <link href="static/layui/css/layui.css" rel="stylesheet" />
    <link href="static/css/index.css" rel="stylesheet" />
  </head>

  <body>
    <main class="dashboard-shell">
      <section class="dashboard-header">
        <div>
          <p class="eyebrow">TELEGRAM MEDIA DOWNLOADER</p>
          <h1>下载任务面板</h1>
        </div>
        <button
          class="stop-btn"
          id="download_state"
          data-value="{{ download_state }}"
          onclick="download_state_change(this)"
        >
          {{ download_state }}
        </button>
      </section>

      <section class="summary-grid" aria-label="下载任务汇总">
        <article class="summary-card summary-card--active">
          <span>进行中</span><strong id="summary_active">0</strong
          ><small>下载中 + 排队</small>
        </article>
        <article class="summary-card summary-card--retrying">
          <span>等待重试</span><strong id="summary_retrying">0</strong
          ><small>自动重新入队</small>
        </article>
        <article class="summary-card summary-card--success">
          <span>成功</span><strong id="summary_success">0</strong
          ><small>当前运行记录</small>
        </article>
        <article class="summary-card summary-card--failed">
          <span>失败</span><strong id="summary_failed">0</strong
          ><small>可在任务结果查看原因</small>
        </article>
      </section>

      <div class="layui-tab" lay-filter="telegram_media_downloader">
        <ul class="layui-tab-title dashboard-tabs">
          <li class="layui-this">进行中</li>
          <li>任务结果</li>
        </ul>
        <div class="layui-tab-content dashboard-content">
          <div class="layui-tab-item layui-show">
            <div class="task-toolbar">
              <div class="table-caption">实时任务状态 <span>每秒刷新</span></div>
              <label class="channel-filter">
                <span>频道</span>
                <select id="active_channel_filter" class="channel-select">
                  <option value="all">全部频道</option>
                </select>
              </label>
            </div>
            <table class="layui-hide" id="download_list"></table>
          </div>
          <div class="layui-tab-item">
            <div class="result-toolbar">
              <div class="table-caption">
                已结束任务 <span>包含成功、失败与跳过</span>
              </div>
              <div class="status-filters" aria-label="任务状态筛选">
                <button
                  class="status-filter filter-active"
                  data-status-filter="all"
                >
                  全部
                </button>
                <button class="status-filter" data-status-filter="failed">
                  失败
                </button>
                <button class="status-filter" data-status-filter="success">
                  成功
                </button>
                <button class="status-filter" data-status-filter="skipped">
                  跳过
                </button>
                <select id="completed_channel_filter" class="channel-select">
                  <option value="all">全部频道</option>
                </select>
              </div>
            </div>
            <table class="layui-hide" id="already_download_list"></table>
          </div>
        </div>
      </div>
    </main>

    <footer class="dashboard-footer">
      <span>Telegram Media Downloader V <b id="app_version">undefined</b></span>
      <span class="speed-indicator"
        ><i class="layui-icon layui-icon-download-circle"></i>
        <b id="download_speed_title">0.00 B/s</b></span
      >
    </footer>

    <script src="static/layui/layui.js"></script>
    <script>
      layui.use(["table", "element"], function () {
        var table = layui.table;
        var element = layui.element;
        var $ = layui.$;
        var completedTasks = [];
        var completedFilter = "all";
        var completedChannelFilter = "all";
        var activeTasks = [];
        var activeTasksSnapshot = "";
        var activeRequestPending = false;
        var activeChannelFilter = "all";
        var channelPalette = [
          "#1677ff",
          "#21a366",
          "#7b61ff",
          "#df4c55",
          "#d48806",
          "#08979c",
          "#c41d7f",
          "#531dab",
        ];
        var stateLabels = {
          queued: "排队中",
          retrying: "等待重试",
          downloading: "下载中",
          success: "成功",
          failed: "失败",
          skipped: "已跳过",
        };

        function escapeHtml(value) {
          return String(value == null ? "" : value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
        }
        function stateBadge(data) {
          var state = data.status || "downloading";
          var label = stateLabels[state] || state;
          if (state === "retrying") label += " · " + data.retry_count + " 次";
          return (
            '<span class="status-badge status-badge--' +
            escapeHtml(state) +
            '">' +
            escapeHtml(label) +
            "</span>"
          );
        }
        function reasonTemplate(data) {
          if (!data.reason) return '<span class="muted">—</span>';
          return (
            '<span class="reason-text" title="' +
            escapeHtml(data.reason) +
            '">' +
            escapeHtml(data.reason) +
            "</span>"
          );
        }
        function progressTemplate(data) {
          var state = data.status || "downloading";
          if (state === "queued" || state === "retrying")
            return (
              '<span class="progress-waiting">' +
              (state === "retrying" ? "等待自动重试" : "等待工作线程") +
              "</span>"
            );
          var progress = Number(data.download_progress || 0);
          var color =
            progress >= 100
              ? "layui-bg-green"
              : progress > 0
                ? "layui-bg-blue"
                : "layui-bg-orange";
          return (
            '<div class="layui-progress layui-progress-big" lay-showpercent="true"><div class="layui-progress-bar ' +
            color +
            '" lay-percent="' +
            progress +
            '%"></div></div>'
          );
        }
        function channelColor(chat) {
          var text = String(chat == null ? "" : chat);
          var hash = 0;
          for (var i = 0; i < text.length; i += 1) {
            hash = (hash * 31 + text.charCodeAt(i)) >>> 0;
          }
          return channelPalette[hash % channelPalette.length];
        }
        function channelTemplate(data) {
          var title = data.chat_title || data.chat || "未知频道";
          var tip =
            data.chat_title && data.chat
              ? data.chat_title + " (" + data.chat + ")"
              : title;
          return (
            '<span class="channel-tag" title="' +
            escapeHtml(tip) +
            '"><i class="channel-dot" style="background:' +
            channelColor(data.chat) +
            '"></i><span class="channel-name">' +
            escapeHtml(title) +
            "</span></span>"
          );
        }
        function fileTemplate(data) {
          return (
            '<span class="file-name" title="' +
            escapeHtml(data.filename) +
            '">' +
            escapeHtml(data.filename) +
            "</span>"
          );
        }
        function shortChatId(chat) {
          var text = String(chat);
          return text.length > 8 ? "…" + text.slice(-6) : text;
        }
        function channelOptions(items) {
          var seen = {};
          var labelCounts = {};
          var options = [];
          items.forEach(function (item) {
            var value = String(item.chat);
            if (seen[value]) return;
            seen[value] = true;
            var label = item.chat_title || value;
            labelCounts[label] = (labelCounts[label] || 0) + 1;
            options.push({ value: value, label: label });
          });
          options.forEach(function (option) {
            // 同名频道在筛选框中补充 chat id，避免无法区分
            if (labelCounts[option.label] > 1) {
              option.label += " (" + shortChatId(option.value) + ")";
            }
          });
          options.sort(function (a, b) {
            return a.label.localeCompare(b.label);
          });
          return options;
        }
        function fillChannelFilter(select, items, currentValue) {
          var options = channelOptions(items);
          var signature = JSON.stringify(options);
          // 频道列表没变化时不重建下拉框，避免打断用户操作
          if (select.data("channel-signature") === signature) {
            return currentValue;
          }
          select.data("channel-signature", signature);
          var html = '<option value="all">全部频道</option>';
          var matched = currentValue === "all";
          options.forEach(function (option) {
            if (option.value === currentValue) matched = true;
            html +=
              '<option value="' +
              escapeHtml(option.value) +
              '">' +
              escapeHtml(option.label) +
              "</option>";
          });
          select.html(html);
          var next = matched ? currentValue : "all";
          select.val(next);
          return next;
        }

        table.render({
          elem: "#download_list",
          id: "download_list",
          data: [],
          height: "full-290",
          limit: 10000,
          even: true,
          cols: [
            [
              {
                field: "chat_title",
                title: "频道",
                minWidth: 160,
                templet: channelTemplate,
              },
              { field: "id", title: "消息 ID", width: 95 },
              {
                field: "filename",
                title: "文件",
                minWidth: 200,
                templet: fileTemplate,
              },
              {
                field: "status",
                title: "状态",
                width: 118,
                templet: stateBadge,
              },
              { field: "attempt", title: "轮次", width: 68, align: "center" },
              {
                field: "total_size",
                title: "大小",
                width: 110,
                align: "right",
              },
              {
                field: "download_progress",
                title: "进度",
                minWidth: 180,
                templet: progressTemplate,
              },
              {
                field: "download_speed",
                title: "速度",
                width: 110,
                align: "right",
              },
              {
                field: "reason",
                title: "当前信息",
                minWidth: 180,
                templet: reasonTemplate,
              },
            ],
          ],
          done: function () {
            // 数据刷新后重新计算进度条宽度
            element.render("progress");
          },
        });
        table.render({
          elem: "#already_download_list",
          id: "already_download_list",
          data: [],
          height: "full-320",
          limit: 10000,
          even: true,
          cols: [
            [
              {
                field: "chat_title",
                title: "频道",
                minWidth: 160,
                templet: channelTemplate,
              },
              { field: "id", title: "消息 ID", width: 95 },
              {
                field: "filename",
                title: "文件",
                minWidth: 200,
                templet: fileTemplate,
              },
              {
                field: "status",
                title: "结果",
                width: 118,
                templet: stateBadge,
              },
              { field: "attempt", title: "轮次", width: 68, align: "center" },
              {
                field: "total_size",
                title: "大小",
                width: 110,
                align: "right",
              },
              {
                field: "reason",
                title: "失败原因 / 说明",
                minWidth: 240,
                templet: reasonTemplate,
              },
              {
                field: "save_path",
                title: "保存位置",
                minWidth: 220,
                templet: function (d) {
                  return (
                    '<span class="path-text" title="' +
                    escapeHtml(d.save_path) +
                    '">' +
                    escapeHtml(d.save_path) +
                    "</span>"
                  );
                },
              },
            ],
          ],
        });

        function renderCompleted() {
          var items = completedTasks.filter(function (item) {
            var statusMatch =
              completedFilter === "all" || item.status === completedFilter;
            var channelMatch =
              completedChannelFilter === "all" ||
              String(item.chat) === completedChannelFilter;
            return statusMatch && channelMatch;
          });
          table.reload("already_download_list", { data: items });
        }
        function renderActiveTasks() {
          var items =
            activeChannelFilter === "all"
              ? activeTasks
              : activeTasks.filter(function (item) {
                  return String(item.chat) === activeChannelFilter;
                });
          // 只刷新表格数据，保留滚动位置以及 done 回调中的进度条渲染
          table.reloadData("download_list", {
            data: items,
            scrollPos: "fixed",
          });
        }
        function updateActiveTasks() {
          if (activeRequestPending) return;
          activeRequestPending = true;
          $.ajax({
            url: "get_download_list?already_down=false",
            dataType: "json",
            timeout: 5000,
          })
            .done(function (items) {
              var snapshot = JSON.stringify(items);
              if (snapshot === activeTasksSnapshot) return;
              activeTasksSnapshot = snapshot;
              activeTasks = items;
              activeChannelFilter = fillChannelFilter(
                $("#active_channel_filter"),
                items,
                activeChannelFilter,
              );
              renderActiveTasks();
            })
            .always(function () {
              activeRequestPending = false;
            });
        }
        function updateCompletedTasks() {
          $.getJSON("get_download_list?already_down=true", function (items) {
            completedTasks = items;
            completedChannelFilter = fillChannelFilter(
              $("#completed_channel_filter"),
              items,
              completedChannelFilter,
            );
            renderCompleted();
          });
        }
        function updateSummary() {
          $.getJSON("get_download_summary", function (summary) {
            $("#summary_active").text(
              (summary.downloading || 0) + (summary.queued || 0),
            );
            $("#summary_retrying").text(summary.retrying || 0);
            $("#summary_success").text(summary.success || 0);
            $("#summary_failed").text(summary.failed || 0);
          });
        }
        function updateDownloadStatus() {
          $.getJSON("get_download_status", function (result) {
            $("#download_speed_title").text(result.download_speed);
          });
        }
        window.download_state_change = function (button) {
          $.post(
            "set_download_state?state=" + button.dataset.value,
            function (result) {
              $(button).text(result);
              button.dataset.value = result;
            },
            "text",
          );
        };

        $(".status-filter").on("click", function () {
          completedFilter = $(this).data("status-filter");
          $(".status-filter").removeClass("filter-active");
          $(this).addClass("filter-active");
          renderCompleted();
        });
        $("#active_channel_filter").on("change", function () {
          activeChannelFilter = $(this).val();
          renderActiveTasks();
        });
        $("#completed_channel_filter").on("change", function () {
          completedChannelFilter = $(this).val();
          renderCompleted();
        });
        $.get(
          "get_app_version",
          function (result) {
            $("#app_version").text(result);
          },
          "text",
        );
        updateActiveTasks();
        updateSummary();
        updateDownloadStatus();
        setInterval(updateActiveTasks, 1000);
        setInterval(updateSummary, 1000);
        setInterval(updateDownloadStatus, 1000);
        element.on("tab(telegram_media_downloader)", function (data) {
          if (data.index === 1) updateCompletedTasks();
        });
      });
    </script>
  </body>
</html>
