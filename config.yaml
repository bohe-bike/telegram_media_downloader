api_hash: your_api_hash
api_id: your_api_id
chat:
- chat_id: telegram_chat_id
  last_read_message_id: 0
file_formats:
  audio:
  - all
  document:
  - all
  video:
  - all
file_path_prefix:
- chat_title
- media_datetime
media_types:
- audio
- photo
- video
- document
- voice
- video_note
# in linux please use /
# save_path: E:\github\telegram_media_downloader

# Retry a failed task after all local download attempts have been exhausted.
failed_download_retry_count: 2
failed_download_retry_interval: 30
# Abort a single stalled transfer and let the retry policy handle it.
download_media_timeout: 3600
# Keep bot mode alive until all queued work has finished.
run_until_all_task_finish_timeout: 0

# 下载完成后整理到同步库。默认只生成计划，在 Web「整理计划」页确认后执行。
organize:
  enable: false
  # 同步库根目录，例如 E:\ASMR
  sync_root: ""
  audio_dir: mp3
  video_dir: mp4
  pending_dir: 未整理
  backup_dir: .organize_backup
  # 会从作者/专辑标签中清除的来源标记
  source_markers:
    - TG@Jingluoasmr
    - ASMR圖書館
  # 手动补充别名映射；auto_learn_aliases 会从已有作者目录学习
  # author_aliases:
  #   别名: 正式作者
  write_audio_tags: true
  auto_learn_aliases: true
  # 扫描同步库 mp3/mp4/未整理 根目录下未归档的文件
  scan_library_roots: true
  # 扫描下载目录（留空时使用 save_path），用于重启后继续整理
  # 整理规则按下载目录下的频道文件夹分别执行，不会跨频道互相影响
  download_root: ""
  scan_download_root: true
